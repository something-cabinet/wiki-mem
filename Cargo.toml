[workspace]
members = ["apps/wm-core", "apps/wm-cli", "apps/wm-server", "packages/wm-code-intel", "packages/wm-embed", "packages/wm-engine", "packages/wm-lsp", "packages/wm-search", "packages/fjadra-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Wiki Memory Team"]

[workspace.dependencies]
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "2", features = ["server", "transport-io"] }
turso = "0.7"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
arc-swap = "1"
oorandom = "11"
tempfile = "3"
anyhow = "1"
walkdir = "2"
dashmap = "5"
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
regex = "1"
streaming-iterator = "0.1"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
