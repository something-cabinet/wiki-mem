[workspace]
members = ["apps/wm-core", "apps/wm-cli", "apps/wm-server", "packages/wm-code-intel", "packages/wm-constants", "packages/wm-embed", "packages/wm-engine", "packages/wm-lsp", "packages/wm-search", "packages/fjadra-wasm", "packages/graph-algo-wasm", "packages/bm25-rerank-wasm", "packages/md-parse-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.3.1"
authors = ["Wiki Memory Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/something-cabinet/wiki-mem"

[workspace.lints.clippy]
cognitive_complexity = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
checked_conversions = "warn"
module_name_repetitions = "warn"
unnecessary_wraps = "warn"
branches_sharing_code = "warn"
dbg_macro = "warn"
exit = "warn"
fn_params_excessive_bools = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
single_match_else = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
uninlined_format_args = "warn"
use_self = "warn"
zero_sized_map_values = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"

[workspace.dependencies]
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "2", features = ["server", "transport-io"] }
turso = "0.7"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
arc-swap = "1"
oorandom = "11"
tempfile = "3"
anyhow = "1"
walkdir = "2"
dashmap = "5"
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
regex = "1"
streaming-iterator = "0.1"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
toml = "0.8"
