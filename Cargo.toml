[workspace]
members = ["apps/wm-core", "apps/wm-cli", "apps/wm-server", "apps/wm-web/src-tauri", "packages/wm-code-intel", "packages/wm-config", "packages/wm-embed", "packages/wm-engine", "packages/wm-error", "packages/wm-page-repo", "packages/wm-parser", "packages/wm-search", "packages/wm-status", "packages/wm-template-engine", "packages/wm-util", "packages/wm-vector-db"]
resolver = "2"

[workspace.dependencies]
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "2", features = ["server", "transport-io"] }
turso = "0.7"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
arc-swap = "1"
oorandom = "11"
tempfile = "3"
anyhow = "1"
walkdir = "2"
dashmap = "5"
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
regex = "1"
streaming_iterator = "0.1"
