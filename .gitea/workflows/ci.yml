name: wiki-mem CI
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref_type }}-${{ gitea.ref_name }}
  cancel-in-progress: true

env:
  CARGO_HOME: /root/.cargo
  CARGO_TARGET_DIR: /home/gitea/actions-cache/cargo/target
  RUSTFLAGS: -C target-cpu=generic
  CFLAGS: -march=x86-64 -mtune=generic

jobs:
  check:
    runs-on: local-host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wm-cli (no onnx — prebuilt libonnxruntime requires AVX2)
        run: cargo build -p wm-cli --no-default-features --features code-intel,lsp

      - name: Run tests (no onnx — same reason)
        run: cargo test -p wm-core --no-default-features --features code-intel,lsp -- -q

  publish:
    if: startsWith(gitea.ref, 'refs/tags/v')
    runs-on: local-host
    needs: [check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean target cache
        run: cargo clean

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Publish to crates.io
        run: cargo release publish --workspace --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
