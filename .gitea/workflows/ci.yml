name: wiki-mem CI
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref_type }}-${{ gitea.ref_name }}
  cancel-in-progress: true

env:
  CARGO_HOME: /root/.cargo
  CARGO_TARGET_DIR: /home/gitea/actions-cache/cargo/target
  RUSTFLAGS: -C target-cpu=generic
  CFLAGS: -march=x86-64 -mtune=generic

jobs:
  check:
    runs-on: local-host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale wm-cli binary
        run: rm -f "${{ env.CARGO_TARGET_DIR }}/debug/wm-cli" "${{ env.CARGO_TARGET_DIR }}/debug/deps/wm-cli"*

      - name: Run tests (no onnx — prebuilt libonnxruntime requires AVX2)
        run: cargo test -p wm-core --no-default-features --features code-intel,lsp -- -q

  publish:
    if: startsWith(gitea.ref, 'refs/tags/v')
    runs-on: local-host
    needs: [check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-npm
        run: cargo install cargo-npm

      - name: Build release
        run: cargo build --release -p wm-cli

      - name: Generate npm packages
        run: cargo npm generate --infer-targets

      - name: Publish to npm
        run: cargo npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
