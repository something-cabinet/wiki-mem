# Template: mcp-tool-schema
name: mcp-tool-schema
description: Generate register_with_schema() call with JSON input schema for an MCP tool
version: 1.0.0

# Link to documentation (optional)
doc: ""

# Base destination path relative to project root
destination: src

# Interactive prompts
prompts:
  - name: name
    type: text
    message: "Name?"
    validate: required

# File generation actions
actions:
  - type: add
    template: "main.hbs"
    path: "{{kebabCase name}}.ts"
    skipIfExists: true

# Success/failure messages
messages:
  success: |
    Created: {{name}}
