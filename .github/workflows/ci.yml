name: wiki-mem CI
on:
  push:
    branches: [master, dev]
    tags: [v*]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Build + lib unit tests + audits. Kept small: the full workspace test
  # profile (~23GB target/ with ort/onnx statically linked into every test
  # binary) exceeds the free runner's 14GB SSD, so heavy test binaries are
  # split into their own jobs below — each gets a fresh runner with its own
  # disk budget.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build wm-cli (needed by CLI integration tests)
        run: cargo build -p wm-cli

      - name: Test lib unit suites (no onnx feature -> no ort link)
        run: cargo test --no-default-features --features "code-intel,lsp" -p wm-core --lib -p wm-search -p wm-engine -p wm-constants -p wm-code-intel -- -q
        env:
          OMP_NUM_THREADS: "1"

      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit

  # mcp_test links the full wm-core + ort test binary (121MB) — isolated on
  # its own runner so its compile stays within the 14GB disk budget.
  test-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build wm-cli (needed by CLI integration tests)
        run: cargo build -p wm-cli

      # mcp_test is now an in-process registry-dispatch suite (no daemon
      # spawns, sub-second) — the sequential-spawn accumulation hang is gone.
      - name: Run mcp_test suite (no onnx feature -> no ort link)
        run: cargo test --no-default-features --features "code-intel,lsp" -p wm-core --test mcp_test -- --test-threads=1 -q
        env:
          OMP_NUM_THREADS: "1"

  # wm-core integration suites (cli/security/path/error/watcher) — own runner.
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build wm-cli (needed by CLI integration tests)
        run: cargo build -p wm-cli

      - name: Run cli/security/path/error/watcher suites (no onnx feature)
        run: cargo test --no-default-features --features "code-intel,lsp" -p wm-core --test cli_test --test security_test --test path_resolution_test --test error_data_transport_test --test file_watcher_test -- -q
        env:
          OMP_NUM_THREADS: "1"

  # embed (ort-heavy) + code-intel + lsp + cli tests — own runner.
  test-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build wm-cli (needed by CLI integration tests)
        run: cargo build -p wm-cli

      - name: Run code-intel + lsp + cli tests (embed onnx covered in test-onnx)
        run: cargo test --no-default-features --features "code-intel,lsp" -p wm-core --lib -p wm-code-intel -p wm-lsp -p wm-cli -- -q
        env:
          OMP_NUM_THREADS: "1"

  # remaining wm-core e2e suites — own runner.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build wm-cli (needed by CLI integration tests)
        run: cargo build -p wm-cli

      - name: Run remaining e2e suites (no onnx feature)
        run: cargo test --no-default-features --features "code-intel,lsp" -p wm-core --test e2e_mcp --test e2e_pages --test e2e_task --test e2e_search --test e2e_graph --test e2e_memory --test e2e_workflow --test e2e_code_intel --test semantic_test -- -q
        env:
          OMP_NUM_THREADS: "1"

  # ONNX/ort coverage — compiled WITH the onnx feature (the only job that
  # links ort). Kept narrow: embed lib tests + mcp model/index tests.
  test-onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build wm-cli (needed by CLI integration tests)
        run: cargo build -p wm-cli
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Run embed lib tests (onnx feature)
        run: cargo test -p wm-embed --features onnx --lib -- -q
        env:
          OMP_NUM_THREADS: "1"
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Run mcp model/index tests (onnx feature)
        run: cargo test -p wm-core --features onnx --test mcp_test -- wm_model wm_index -- -q
        env:
          OMP_NUM_THREADS: "1"
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross-compiler + linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build release for ${{ matrix.target }}
        run: cargo build --release -p wm-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ env.CARGO_TARGET_DIR || 'target' }}/${{ matrix.target }}/release/wm-cli${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
