name: wiki-mem CI
on:
  push:
    branches: [master, dev]
    tags: [v*]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build wm-cli + wm-server (needed by CLI integration tests)
        run: cargo build -p wm-cli -p wm-server

      - name: Run tests
        run: cargo test --workspace -- -q
        env:
          OMP_NUM_THREADS: "1"

      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wm-web/package-lock.json

      - name: npm audit (production deps)
        run: |
          cd apps/wm-web
          npm ci --ignore-scripts
          npm audit --omit=dev

  e2e-stress:
    # HTTP-API E2E + stress suites against the live wm-server daemon (tasks
    # e2e / stress). These test targets spawn wm-server on fixture projects and
    # drive the web API + MCP channel over HTTP; heavy benchmarks stay
    # `#[ignore]`d and run locally via:
    #   cargo test -p wm-core --test stress_test -- --ignored
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build wm-cli + wm-server (daemon under test)
        run: cargo build -p wm-cli -p wm-server

      - name: Run HTTP E2E suite (live daemon)
        run: cargo test -p wm-core --test e2e_http

      - name: Run stress suite (concurrent daemon test; heavy benchmarks ignored)
        run: cargo test -p wm-core --test stress_test
        env:
          OMP_NUM_THREADS: "1"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross-compiler + linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build release for ${{ matrix.target }}
        run: cargo build --release -p wm-cli -p wm-server --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ env.CARGO_TARGET_DIR || 'target' }}/${{ matrix.target }}/release/wm-cli${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
            ${{ env.CARGO_TARGET_DIR || 'target' }}/${{ matrix.target }}/release/wm-server${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-npm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-npm

      - name: Set up Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wm-web/package-lock.json

      - name: Build Angular frontend
        run: |
          cd apps/wm-web
          npm ci
          npm run build

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: false

      - name: Place binaries into target directories
        run: |
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            dir="target/$triple/release"
            mkdir -p "$dir"
            src="binary-$triple/wm-cli"
            [ -f "$src" ] && cp "$src" "$dir/" || echo "warning: no wm-cli binary for $triple"
            [ -f "binary-$triple/wm-cli.exe" ] && cp "binary-$triple/wm-cli.exe" "$dir/"
            src="binary-$triple/wm-server"
            [ -f "$src" ] && cp "$src" "$dir/" || echo "warning: no wm-server binary for $triple"
            [ -f "binary-$triple/wm-server.exe" ] && cp "binary-$triple/wm-server.exe" "$dir/"
          done

      - name: Generate npm packages for all targets
        run: |
          cargo npm generate -p wm-cli --infer-targets
          cargo npm generate -p wm-server --infer-targets

      - name: Bundle Angular frontend into wm-server platform packages
        run: |
          matched=0
          for dir in npm/@something-cabinet/wm-server-*/; do
            [ -d "$dir" ] || { echo "no wm-server platform packages found"; exit 1; }
            matched=1
            mkdir -p "$dir/wm-web/dist/browser"
            cp -r apps/wm-web/dist/browser/* "$dir/wm-web/dist/browser/"
            [ -f "$dir/wm-web/dist/browser/index.html" ] || { echo "frontend not bundled into $dir"; exit 1; }
          done
          [ "$matched" = 1 ] || { echo "bundle glob matched 0 dirs"; exit 1; }
          echo "bundled frontend into wm-server platform packages"

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          cargo npm publish -p wm-cli
          # cargo npm publish builds platform tarballs from an explicit entry list
          # (package.json + bins + license), dropping bundled wm-web/ assets.
          # Publish wm-server platform packages directly so npm packs the whole dir.
          for dir in npm/@something-cabinet/wm-server-*/; do
            (cd "$dir" && npm publish)
          done
          # Publish the main wm-server package after platform packages so
          # optionalDependencies resolve.
          (cd npm/@something-cabinet/wm-server && npm publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
