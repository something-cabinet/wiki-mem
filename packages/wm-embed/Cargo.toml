[package]
name = "wm-embed"
version = "0.2.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "ONNX embedding pipeline for the Wiki Memory Engine"

[features]
onnx = ["dep:ort", "dep:tokenizers", "dep:reqwest", "dep:indicatif"]

[dependencies]
wm-engine = { path = "../wm-engine", version = "0.2.0" }
wm-constants = { path = "../wm-constants", version = "0.2.0" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rayon = { workspace = true }
arc-swap = { workspace = true }
chrono = { workspace = true }
oorandom = { workspace = true }
tempfile = { workspace = true }
turso = { workspace = true }
tokio = { workspace = true }
ort = { version = "2.0.0-rc.12", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["http", "onig"], optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "blocking"], default-features = false, optional = true }
indicatif = { version = "0.17", optional = true }
