<!doctype html>
<html lang="en">
<head>
<script>
  (function() {
    var dark = localStorage.getItem('wm-dark-mode');
    if (dark === 'true' || (dark === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
  <meta charset="utf-8">
  <title>WM Engine — Wiki Memory Engine</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wiki Memory Engine — AI-powered wiki management with search, graph, and memory">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#252525" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="bg-background text-foreground antialiased">
  <app-root></app-root>
</body>
</html>
