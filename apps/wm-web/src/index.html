<!doctype html>
<html lang="en">
<head>
<script>
  (function() {
    var dark = localStorage.getItem('wm-dark-mode');
    // 'true' pins dark, 'false' pins light, anything else (unset or 'system') follows the OS.
    if (dark === 'true' || (dark !== 'false' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
  <meta charset="utf-8">
  <title>WM Engine — Wiki Memory Engine</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wiki Memory Engine — AI-powered wiki management with search, graph, and memory">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#252525" media="(prefers-color-scheme: dark)">
  <meta
    http-equiv="Content-Security-Policy"
