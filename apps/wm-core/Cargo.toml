[package]
name = "wm-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
embed = ["dep:ort", "dep:tokenizers", "dep:memmap2", "dep:ndarray", "dep:reqwest", "dep:indicatif"]
code-intel = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-html",
    "dep:tree-sitter-svelte-ng",
]

[dev-dependencies]
tempfile = "3"

[dependencies]
wm-error = { path = "../../packages/wm-error" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
turso = "0.7"
arc-swap = "1"
dashmap = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sha2 = "0.10"
hex = "0.4"
petgraph = { version = "0.6", features = ["serde-1"] }
walkdir = "2"
regex = "1"
oorandom = "11.1"
rust-embed = "8"
rmcp = { version = "2", features = ["server", "transport-io"] }
schemars = { version = "1", features = ["derive"] }
rayon = "1"
streaming-iterator = "0.1"

wm-status = { path = "../../packages/wm-status" }

wm-util = { path = "../../packages/wm-util" }

wm-template-engine = { path = "../../packages/wm-template-engine" }

wm-page-repo = { path = "../../packages/wm-page-repo" }

wm-vector-db = { path = "../../packages/wm-vector-db" }

wm-embed = { path = "../../packages/wm-embed" }
wm-config = { path = "../../packages/wm-config" }
wm-engine = { path = "../../packages/wm-engine" }

# ONNX embedding dependencies (behind "embed" feature)
ort = { version = "2.0.0-rc.12", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["http", "onig"], optional = true }
memmap2 = { version = "0.9", optional = true }
ndarray = { version = "0.16", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "blocking"], default-features = false, optional = true }
indicatif = { version = "0.17", optional = true }
tree-sitter = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-svelte-ng = { version = "1", optional = true }
