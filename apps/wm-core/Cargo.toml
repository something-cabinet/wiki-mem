[package]
name = "wm-core"
version = "0.3.1"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Core library — graph engine, search, MCP tools for the Wiki Memory Engine"

[features]
default = ["onnx", "code-intel", "lsp"]
onnx = ["wm-embed/onnx"]
code-intel = ["dep:wm-code-intel"]
lsp = ["dep:wm-lsp", "dep:lsp-types"]

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
turso = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
petgraph = { workspace = true, features = ["serde-1"] }
walkdir = { workspace = true }
regex = { workspace = true }
oorandom = { workspace = true }
rust-embed = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
rayon = { workspace = true }
streaming-iterator = { workspace = true }

# File watcher
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

toml = { workspace = true }

# Keep packages (external deps)
wm-embed = { path = "../../packages/wm-embed" }
wm-engine = { path = "../../packages/wm-engine" }
wm-constants = { path = "../../packages/wm-constants" }
wm-search = { path = "../../packages/wm-search" }
wm-code-intel = { path = "../../packages/wm-code-intel", optional = true, features = ["code-intel"] }
wm-lsp = { path = "../../packages/wm-lsp", optional = true }
lsp-types = { version = "0.97", optional = true }



