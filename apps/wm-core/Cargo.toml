[package]
name = "wm-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
embed = ["wm-embed/onnx"]
code-intel = ["dep:wm-code-intel"]

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
wm-error = { path = "../../packages/wm-error" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
turso = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
petgraph = { workspace = true, features = ["serde-1"] }
walkdir = { workspace = true }
regex = { workspace = true }
oorandom = { workspace = true }
rust-embed = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
rayon = { workspace = true }
streaming-iterator = { workspace = true }

wm-status = { path = "../../packages/wm-status" }

wm-util = { path = "../../packages/wm-util" }

wm-template-engine = { path = "../../packages/wm-template-engine" }

wm-page-repo = { path = "../../packages/wm-page-repo" }

wm-vector-db = { path = "../../packages/wm-vector-db" }

wm-embed = { path = "../../packages/wm-embed" }
wm-config = { path = "../../packages/wm-config" }
wm-engine = { path = "../../packages/wm-engine" }
wm-parser = { path = "../../packages/wm-parser" }
wm-search = { path = "../../packages/wm-search" }
wm-shared = { path = "../../packages/wm-shared" }
wm-code-intel = { path = "../../packages/wm-code-intel", optional = true, features = ["code-intel"] }



