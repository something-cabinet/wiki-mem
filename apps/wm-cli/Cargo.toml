[package]
name = "wm-cli"
version = "0.5.2"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "CLI for the Wiki Memory Engine"

[features]
default = ["onnx", "code-intel", "lsp"]
onnx = ["wm-core/onnx", "wm-tools/onnx"]
code-intel = ["wm-core/code-intel", "wm-tools/code-intel"]
lsp = ["wm-core/lsp", "wm-tools/lsp"]
decision = ["wm-core/decision", "wm-tools/decision"]

[dependencies]
wm-core = { path = "../wm-core", default-features = false }
wm-tools = { path = "../../packages/wm-tools", default-features = false }
wm-engine = { path = "../../packages/wm-engine" }
wm-constants = { path = "../../packages/wm-constants" }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
petgraph = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true }
is-terminal = "0.4"
dialoguer = "0.11"
indicatif = "0.17"
rayon = { workspace = true }

[package.metadata.npm]
name = "@something-cabinet/wm-cli"
prefix = "@something-cabinet/wm-cli-"
bins = ["wm-cli"]
custom = {
  publishConfig = { access = "public" }
}

