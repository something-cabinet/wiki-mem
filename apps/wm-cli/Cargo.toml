[package]
name = "wm-cli"
version = "0.4.2"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "CLI and TUI for the Wiki Memory Engine"

[features]
default = ["onnx", "code-intel", "lsp"]
onnx = ["wm-core/onnx"]
code-intel = ["wm-core/code-intel"]
lsp = ["wm-core/lsp"]

[dependencies]
# rmcp is optional in wm-core; wm-cli owns the MCP stdio transport (the
# in-process mcp_server.rs), so it enables the feature.
wm-core = { path = "../wm-core", features = ["rmcp"] }
wm-constants = { path = "../../packages/wm-constants" }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
petgraph = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true }
ratatui = "0.30"
is-terminal = "0.4"
dialoguer = "0.11"
indicatif = "0.17"
rayon = { workspace = true }

[package.metadata.npm]
name = "@something-cabinet/wm-cli"
prefix = "@something-cabinet/wm-cli-"
bins = ["wm-cli"]
custom = {
  publishConfig = { access = "public" },
  optionalDependencies = { "@something-cabinet/wm-server" = "^0.3" }
}

