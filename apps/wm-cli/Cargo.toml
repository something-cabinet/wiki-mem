[package]
name = "wm-cli"
version = "0.3.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "CLI and TUI for the Wiki Memory Engine"

[features]
default = ["onnx", "code-intel", "lsp"]
onnx = ["wm-core/onnx"]
code-intel = ["wm-core/code-intel"]
lsp = ["wm-core/lsp"]

[dependencies]
wm-core = { path = "../wm-core", version = "0.2.1" }
wm-constants = { path = "../../packages/wm-constants", version = "0.2.1" }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
petgraph = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true }
ratatui = "0.26"
crossterm = "0.28"
is-terminal = "0.4"
dialoguer = "0.11"
indicatif = "0.17"
rayon = { workspace = true }

[package.metadata.npm]
name = "@something-cabinet/wm-cli"
prefix = "@something-cabinet/wm-cli-"
bins = ["wm-cli"]
custom = { publishConfig = { access = "public" } }

